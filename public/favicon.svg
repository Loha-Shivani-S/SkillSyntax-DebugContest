<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#092215" />
      <stop offset="100%" stop-color="#020804" />
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Circuit grid lines -->
  <path d="M8 20h8v8M56 20h-8v8M8 44h8v-8M56 44h-8v-8M32 6v6M32 52v6" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" fill="none" />
  <circle cx="16" cy="28" r="1.5" fill="#10b981" />
  <circle cx="48" cy="28" r="1.5" fill="#10b981" />
  <circle cx="16" cy="36" r="1.5" fill="#10b981" />
  <circle cx="48" cy="36" r="1.5" fill="#10b981" />

  <!-- Debug Bug / Chip Body -->
  <!-- Bug Antennae -->
  <path d="M26 18 L20 12 M38 18 L44 12" stroke="#34d399" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="20" cy="12" r="1.5" fill="#f59e0b" />
  <circle cx="44" cy="12" r="1.5" fill="#f59e0b" />

  <!-- Bug Legs -->
  <path d="M18 26 L10 24 M18 32 L8 32 M18 38 L10 40 M46 26 L54 24 M46 32 L56 32 M46 38 L54 40" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Bug Head -->
  <path d="M25 21 C25 17, 39 17, 39 21 Z" fill="#34d399" filter="url(#glow)" />
  
  <!-- Bug Shell / Central Microchip -->
  <rect x="22" y="23" width="20" height="22" rx="6" fill="#042f2e" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
  
  <!-- Center Core / Status LED -->
  <line x1="32" y1="24" x2="32" y2="44" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2" />
  <circle cx="32" cy="32" r="3" fill="#ef4444" />
  <circle cx="32" cy="32" r="1.5" fill="#fef08a" />
</svg>
